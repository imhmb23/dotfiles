# ==============================================================================
# ALACRITTY CONFIGURATION (TOML) - Dark Pastels
# ==============================================================================

[general]
live_config_reload = true
working_directory = "None"

# ------------------------------------------------------------------------------
# WINDOW CONFIGURATION
# ------------------------------------------------------------------------------
[window]
dimensions = { columns = 80, lines = 28 }
padding = { x = 10, y = 10 }
dynamic_padding = true
dynamic_title = false
decorations = "None"
opacity = 1          # changed from 0.93; lower = more wallpaper visible
blur = true          # no effect on Windows, harmless to keep
startup_mode = "Windowed"
title = "alacritty"

# ------------------------------------------------------------------------------
# SHELL CONFIGURATION (WINDOWS POWERSHELL DEFAULT)
# ------------------------------------------------------------------------------
[terminal.shell]
program = "pwsh.exe"
args = ["-NoLogo"]

# ------------------------------------------------------------------------------
# FONT CONFIGURATION
# ------------------------------------------------------------------------------
[font]
normal = { family = "BlexMono Nerd Font", style = "Regular" }
bold = { family = "BlexMono Nerd Font", style = "Bold" }
italic = { family = "BlexMono Nerd Font", style = "Italic" }
bold_italic = { family = "BlexMono Nerd Font", style = "Bold Italic" }

size = 14.0
offset = { x = 0, y = 2 }
glyph_offset = { x = 0, y = 1 }

# ------------------------------------------------------------------------------
# CURSOR STYLE
# ------------------------------------------------------------------------------
[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

# ------------------------------------------------------------------------------
# SCROLLBACK BUFFER
# ------------------------------------------------------------------------------
[scrolling]
history = 10000
multiplier = 3

# ------------------------------------------------------------------------------
# COLOR SCHEME (DARK PASTELS)
# ------------------------------------------------------------------------------
[colors.primary]
background = "#2c2c2c"
foreground = "#dcdccc"
dim_foreground = "#dcdccc"
bright_foreground = "#dcdccc"

[colors.cursor]
text = "#2c2c2c"
cursor = "#dcdccc"

[colors.vi_mode_cursor]
text = "#2c2c2c"
cursor = "#94bff3"

[colors.selection]
text = "#2c2c2c"
background = "#dcdccc"

[colors.search.matches]
foreground = "#2c2c2c"
background = "#dcdccc"

[colors.search.focused_match]
foreground = "#2c2c2c"
background = "#72d5a3"

[colors.footer_bar]
foreground = "#2c2c2c"
background = "#dcdccc"

[colors.hints.start]
foreground = "#2c2c2c"
background = "#f0dfaf"

[colors.hints.end]
foreground = "#2c2c2c"
background = "#dcdccc"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.normal]
black   = "#3f3f3f"
red     = "#705050"
green   = "#60b48a"
yellow  = "#dfaf8f"
blue    = "#9ab8d7"
magenta = "#dc8cc3"
cyan    = "#8cd0d3"
white   = "#dcdccc"

[colors.bright]
black   = "#709080"
red     = "#dca3a3"
green   = "#72d5a3"
yellow  = "#f0dfaf"
blue    = "#94bff3"
magenta = "#ec93d3"
cyan    = "#93e0e3"
white   = "#ffffff"

[colors.dim]
black   = "#343434"
red     = "#664848"
green   = "#57a37c"
yellow  = "#aa856f"
blue    = "#758da1"
magenta = "#9a6289"
cyan    = "#6b9fa1"
white   = "#95958b"

# ------------------------------------------------------------------------------
# KEYBINDINGS
# ------------------------------------------------------------------------------
[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"   

[[keyboard.bindings]]
key = "C"
mods = "Control"
action = "Copy"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"
