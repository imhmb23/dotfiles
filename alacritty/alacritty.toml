# ==============================================================================
# ALACRITTY CONFIGURATION (TOML) - Catppuccin Mocha
# ==============================================================================

[general]
live_config_reload = true
working_directory = "C:/Users/HS TRADER/Desktop"

# ------------------------------------------------------------------------------
# WINDOW CONFIGURATION
# --------------------------------------------------------------------- ---------
[window]
dimensions = { columns = 100, lines = 28 }
padding = { x = 10, y = 10 }
dynamic_padding = true
dynamic_title = false
decorations = "None"
opacity = 1          # changed from 0.93; lower = more wallpaper visible
blur = true             # no effect on Windows, harmless to keep
startup_mode = "Windowed"
title = "Alacritty Terminal"

# ------------------------------------------------------------------------------
# SHELL CONFIGURATION (WINDOWS POWERSHELL DEFAULT)
# ------------------------------------------------------------------------------
[terminal.shell]
program = "pwsh.exe"
args = ["-NoLogo"]

# ------------------------------------------------------------------------------
# FONT CONFIGURATION
# ------------------------------------------------------------------------------
[font]
normal = { family = "BlexMono Nerd Font", style = "Regular" }
bold = { family = "BlexMono Nerd Font", style = "Bold" }
italic = { family = "BlexMono Nerd Font", style = "Italic" }
bold_italic = { family = "BlexMono Nerd Font", style = "Bold Italic" }

size = 11.0
offset = { x = 0, y = 2 }
glyph_offset = { x = 0, y = 1 }

# ------------------------------------------------------------------------------
# CURSOR STYLE
# ------------------------------------------------------------------------------
[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

# ------------------------------------------------------------------------------
# SCROLLBACK BUFFER
# ------------------------------------------------------------------------------
[scrolling]
history = 10000
multiplier = 3

# ------------------------------------------------------------------------------
# COLOR SCHEME (CATPPUCCIN MOCHA)
# ------------------------------------------------------------------------------
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.vi_mode_cursor]
text = "#1e1e2e"
cursor = "#b4befe"

[colors.selection]
text = "#1e1e2e"
background = "#f5e0dc"

[colors.search.matches]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.search.focused_match]
foreground = "#1e1e2e"
background = "#a6e3a1"

[colors.footer_bar]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.hints.start]
foreground = "#1e1e2e"
background = "#f9e2af"

[colors.hints.end]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#a6adc8"

# ------------------------------------------------------------------------------
# KEYBINDINGS
# ------------------------------------------------------------------------------
[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control"
action = "Copy"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"